name: Check EAS Build

on:
  push:
    branches: [main]

jobs:
  check:
    if: contains(github.event.head_commit.message, '[status]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Wait for latest production build
        shell: bash
        run: |
          for attempt in {1..30}; do
            JSON="$(eas build:list --platform android --build-profile production --limit 1 --json --non-interactive)"
            echo "$JSON"
            STATUS="$(printf '%s' "$JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);console.log(v[0]?.status||'UNKNOWN')})")"
            echo "STATUS=$STATUS"
            if [ "$STATUS" = "FINISHED" ]; then exit 0; fi
            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then exit 1; fi
            sleep 30
          done
          exit 1
